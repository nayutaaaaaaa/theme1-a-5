<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>シフト管理アプリ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>シフト管理アプリ</h1>
    <section class="shift-form">
      <label for="date-input">日付</label>
      <input id="date-input" type="date" />

      <label for="start-time-input">始業時間</label>
      <input id="start-time-input" type="time" />

      <label for="end-time-input">終業時間</label>
      <input id="end-time-input" type="time" />

      <label for="shift-name">名前</label>
      <input id="shift-name" type="text" placeholder="シフトの名前を入力" />

      <button id="add-button" type="button">登録</button>
    </section>

    <section class="shift-list-section">
      <h2>シフト一覧</h2>
      <table id="shift-list">
      <thead>
        <tr>
        <th>日付</th>
        <th>曜日</th>
        <th>始業時間</th>
        <th>終業時間</th>
        <th>名前</th>
        </tr>
      </thead>
      <tbody></tbody>
      </table>
    </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
